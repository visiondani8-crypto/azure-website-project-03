

name: Azure Website Health Check

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate a monitoring failure"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check Azure website
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}
        run: |
          set -euo pipefail

          URL="https://polite-smoke-0e690c510.5.azurestaticapps.net"

          RESULT=$(curl -L -sS \
            --connect-timeout 5 \
            --max-time 20 \
            --retry 2 \
            -o /tmp/homepage.html \
            -w "%{http_code} %{time_total}" \
            "$URL")

          read -r STATUS TIME <<< "$RESULT"

          echo "HTTP Status: $STATUS"
          echo "Response Time: ${TIME}s"

          if [ "$STATUS" != "200" ]; then
            echo "::error::HTTP health check failed"
            exit 1
          fi

          EXPECTED="Azure Cloud Portfolio"

          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Running controlled failure simulation"
            EXPECTED="__simulated_missing_content__"
          fi

          if ! grep -Fq "$EXPECTED" /tmp/homepage.html; then
            echo "::error::Homepage content check failed"
            exit 1
          fi

          echo "Website health check PASSED"
