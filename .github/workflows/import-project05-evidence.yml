name: Import Project 5 IaC evidence screenshots

on:
  push:
    paths:
      - 'projects/project-05-iac/project5_evidence_redacted.zip'
      - '.github/workflows/import-project05-evidence.yml'

permissions:
  contents: write

jobs:
  import-project05-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract validated screenshots into Project 5 directory
        shell: bash
        run: |
          set -euo pipefail
          archive="projects/project-05-iac/project5_evidence_redacted.zip"
          target="projects/project-05-iac/evidence"
          test -s "$archive"
          mkdir -p "$target"
          unzip -o -q -j "$archive" 'evidence/*.png' -d "$target"
          expected=(
            "01_initial_whatif_3_create.png"
            "02_initial_deployment_success.png"
            "03_network_subnet_nsg_validation.png"
            "04_whatif_policy_correction.png"
            "05_security_rule_verified.png"
            "06_repeat_deployment_success.png"
            "07_final_whatif_no_changes.png"
            "08_bicep_source_validation.png"
          )
          for img in "${expected[@]}"; do
            test -s "$target/$img"
            file --mime-type "$target/$img" | grep -q 'image/png'
          done
          test "$(find "$target" -maxdepth 1 -name '*.png' | wc -l)" -eq "${#expected[@]}"
          echo "All eight Project 5 evidence screenshots verified."

      - name: Commit inline evidence images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/project-05-iac/evidence/
          if git diff --cached --quiet; then
            echo "Images already committed"
          else
            git commit -m "docs: publish eight Project 5 Azure IaC evidence screenshots [skip ci]"
            git push origin HEAD:main
          fi
