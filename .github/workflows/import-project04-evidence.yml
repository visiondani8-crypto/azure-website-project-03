name: Import Project 4 evidence screenshots
on:
  push:
    paths:
      - .github/workflows/import-project04-evidence.yml
permissions:
  contents: write
jobs:
  import-project04-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate cropped evidence screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/project-04
          unzip -o -j project04_evidence.zip '*.png' -d evidence/project-04
          for file in \
            01_azure_activity_log.png \
            02_manual_http_check.png \
            03_simulated_failure.png \
            04_github_failure_notifications.png \
            05_final_monitoring_success.png; do
            test -s "evidence/project-04/$file"
            file --mime-type "evidence/project-04/$file" | grep -q 'image/png'
          done
      - name: Commit evidence images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/project-04/
          if git diff --cached --quiet; then
            echo "Evidence images already committed"
          else
            git commit -m "docs: add inline Project 4 monitoring screenshots [skip ci]"
            git push origin HEAD:main
          fi
